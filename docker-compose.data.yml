# KnowYourGov â€” Data tier
#   PostgreSQL 17 + Redis 7. Bind ports to a private/internal interface only
#   (set DATA_BIND_IP in `.env`; never expose these ports publicly).
# Deploy: docker compose -f docker-compose.data.yml up -d
# Requires an `.env` file containing DB_PASSWORD, REDIS_PASSWORD, DATA_BIND_IP.
# â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

name: iv-data

services:
  # â”€â”€ PostgreSQL 17 â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  postgres:
    image: postgres:17-alpine
    container_name: iv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: KnowYourGov
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: KnowYourGov
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Bind to a private interface only (never 0.0.0.0)
      - "${DATA_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U KnowYourGov -d KnowYourGov"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iv

  # â”€â”€ Redis 7 (rate limiting + distributed locks) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  redis:
    image: redis:7-alpine
    container_name: iv-redis
    restart: unless-stopped
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "192mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "${DATA_BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - iv

networks:
  iv:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
